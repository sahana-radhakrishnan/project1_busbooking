
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRANSITIQ | Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f5fa;color:#20283b}
header{background:#172554;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header button,.btn{border:0;border-radius:7px;padding:11px 17px;cursor:pointer;font-weight:bold}
header button{background:white;color:#172554}
main{max-width:1150px;margin:30px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin-bottom:25px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 15px #0000000d}
h2{font-size:19px;margin-bottom:16px}
.section-title{margin:28px 0 14px}
label{font-size:13px;font-weight:bold}
input,select{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #ccd2df;border-radius:7px}
.btn{background:#1d4ed8;color:white;width:100%}
.danger{background:#dc2626;color:white;border:0;border-radius:5px;padding:8px;cursor:pointer}
.table-wrap{overflow-x:auto;background:white;border-radius:10px;padding:12px;margin-bottom:25px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
th{background:#eff3fa}
#notice{margin-bottom:15px}
.success{color:#15803d}
.error{color:#dc2626}
small{color:#64748b}
</style>
</head>
<body>

<header>
    <h1>TRANSITIQ | Admin Portal</h1>
    <div>
        <span>Administrator</span>
        <button onclick="logout()">Logout</button>
    </div>
</header>

<main>
    <p id="notice"></p>

    <div class="grid">
        <section class="card">
            <h2>Add New Bus</h2>
            <form id="busForm">
                <label>Bus Number</label>
                <input name="bus_number" placeholder="TN33AB1234" required>
                <label>Bus Name</label>
                <input name="bus_name" placeholder="Example Express" required>
                <label>Bus Type</label>
                <select name="bus_type" required>
                    <option value="">Select type</option>
                    <option>AC</option>
                    <option>NON-AC</option>
                    <option>SLEEPER</option>
                </select>
                <label>Total Seats</label>
                <input name="total_seats" type="number" min="1" max="100" required>
                <button class="btn">Add Bus</button>
            </form>
        </section>

        <section class="card">
            <h2>Add New Route</h2>
            <form id="routeForm">
                <label>Source City</label>
                <input name="source_city" placeholder="Erode" required>
                <label>Destination City</label>
                <input name="destination_city" placeholder="Coimbatore" required>
                <label>Distance (KM)</label>
                <input name="distance_km" type="number" min="1" step="0.01" required>
                <button class="btn">Add Route</button>
            </form>
        </section>

        <section class="card">
            <h2>Create Bus Schedule</h2>
            <form id="scheduleForm">
                <label>Bus</label>
                <select name="bus_id" id="busSelect" required></select>
                <label>Route</label>
                <select name="route_id" id="routeSelect" required></select>
                <label>Departure</label>
                <input name="departure_datetime" type="datetime-local" required>
                <label>Arrival</label>
                <input name="arrival_datetime" type="datetime-local" required>
                <label>Fare (₹)</label>
                <input name="fare" type="number" min="1" step="0.01" required>
                <button class="btn">Create Schedule</button>
            </form>
            <small>Schedules can be created for future dates.</small>
        </section>
    </div>

    <h2 class="section-title">Manage Buses</h2>
    <div class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Name</th><th>Number</th><th>Type</th><th>Seats</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="busTable"></tbody>
        </table>
    </div>

    <h2 class="section-title">Manage Routes</h2>
    <div class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Source</th><th>Destination</th><th>Distance</th></tr></thead>
            <tbody id="routeTable"></tbody>
        </table>
    </div>

    <h2 class="section-title">Manage Schedules</h2>
    <div class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Bus</th><th>Route</th><th>Departure</th><th>Arrival</th><th>Fare</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="scheduleTable"></tbody>
        </table>
    </div>
</main>

<script>
const token = localStorage.getItem("transitiq_admin_token");

function logout() {
    localStorage.removeItem("transitiq_admin_token");
    localStorage.removeItem("transitiq_admin_user");
    window.location.replace("admin-login.html");
}

if (!token) {
    window.location.replace("admin-login.html");
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
}

function showMessage(text, error = false) {
    const el = document.getElementById("notice");
    el.textContent = text;
    el.className = error ? "error" : "success";
    window.scrollTo({top:0,behavior:"smooth"});
}

async function api(url, method = "GET", body = null) {
    const options = {
        method,
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        }
    };

    if (body !== null) options.body = JSON.stringify(body);

    const response = await fetch("/api/admin" + url, options);
    const data = await response.json();

    if (response.status === 401 || response.status === 403) {
        logout();
        throw new Error("Your admin session is invalid. Please login again.");
    }

    if (!response.ok) throw new Error(data.message || "Request failed.");
    return data;
}

async function verifyAdmin() {
    const response = await fetch("/api/auth/profile", {
        headers: {"Authorization":"Bearer " + token}
    });

    if (!response.ok) {
        logout();
        return false;
    }

    const data = await response.json();

    if (!data.user || data.user.role !== "ADMIN") {
        logout();
        return false;
    }

    return true;
}

async function loadBuses() {
    const data = await api("/buses");

    document.getElementById("busTable").innerHTML =
        data.buses.map(b => `
        <tr>
            <td>${b.bus_id}</td>
            <td>${escapeHTML(b.bus_name)}</td>
            <td>${escapeHTML(b.bus_number)}</td>
            <td>${escapeHTML(b.bus_type)}</td>
            <td>${b.total_seats}</td>
            <td>${b.is_active ? "ACTIVE" : "INACTIVE"}</td>
            <td><button class="${b.is_active ? "danger" : "btn"}"
                style="width:auto"
                onclick="toggleBus(${b.bus_id},${!Boolean(b.is_active)})">
                ${b.is_active ? "Deactivate" : "Activate"}</button></td>
        </tr>`).join("") || '<tr><td colspan="7">No buses found.</td></tr>';

    const active = data.buses.filter(b => Boolean(b.is_active));
    document.getElementById("busSelect").innerHTML =
        '<option value="">Select bus</option>' +
        active.map(b => `<option value="${b.bus_id}">${escapeHTML(b.bus_name)} (${escapeHTML(b.bus_number)})</option>`).join("");
}

async function loadRoutes() {
    const data = await api("/routes");

    document.getElementById("routeTable").innerHTML =
        data.routes.map(r => `
        <tr><td>${r.route_id}</td>
        <td>${escapeHTML(r.source_city)}</td>
        <td>${escapeHTML(r.destination_city)}</td>
        <td>${r.distance_km}</td></tr>`).join("") ||
        '<tr><td colspan="4">No routes found.</td></tr>';

    document.getElementById("routeSelect").innerHTML =
        '<option value="">Select route</option>' +
        data.routes.map(r => `<option value="${r.route_id}">${escapeHTML(r.source_city)} → ${escapeHTML(r.destination_city)}</option>`).join("");
}

async function loadSchedules() {
    const data = await api("/schedules");

    document.getElementById("scheduleTable").innerHTML =
        data.schedules.map(s => `
        <tr>
            <td>${s.schedule_id}</td>
            <td>${escapeHTML(s.bus_name)}</td>
            <td>${escapeHTML(s.source_city)} → ${escapeHTML(s.destination_city)}</td>
            <td>${new Date(s.departure_datetime).toLocaleString("en-IN")}</td>
            <td>${new Date(s.arrival_datetime).toLocaleString("en-IN")}</td>
            <td>₹${s.fare}</td>
            <td>${s.status}</td>
            <td>
                <select onchange="changeSchedule(${s.schedule_id},this.value)">
                    <option value="">Change status</option>
                    <option value="SCHEDULED">Scheduled</option>
                    <option value="CANCELLED">Cancelled</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </td>
        </tr>`).join("") ||
        '<tr><td colspan="8">No schedules found.</td></tr>';
}

async function toggleBus(id, active) {
    if (!confirm(active ? "Activate this bus?" : "Deactivate this bus?")) return;
    try {
        const data = await api(`/buses/${id}/status`, "PATCH", {active});
        showMessage(data.message);
        await loadBuses();
    } catch(e) { showMessage(e.message, true); }
}

async function changeSchedule(id, status) {
    if (!status) return;
    if (!confirm("Update this schedule status?")) {
        await loadSchedules();
        return;
    }
    try {
        const data = await api(`/schedules/${id}/status`, "PATCH", {status});
        showMessage(data.message);
        await loadSchedules();
    } catch(e) {
        showMessage(e.message, true);
        await loadSchedules();
    }
}

document.getElementById("busForm").addEventListener("submit", async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.total_seats = Number(body.total_seats);
    try {
        const data = await api("/buses", "POST", body);
        showMessage(data.message);
        e.target.reset();
        await loadBuses();
    } catch(error) { showMessage(error.message, true); }
});

document.getElementById("routeForm").addEventListener("submit", async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.distance_km = Number(body.distance_km);
    try {
        const data = await api("/routes", "POST", body);
        showMessage(data.message);
        e.target.reset();
        await loadRoutes();
    } catch(error) { showMessage(error.message, true); }
});

document.getElementById("scheduleForm").addEventListener("submit", async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.bus_id = Number(body.bus_id);
    body.route_id = Number(body.route_id);
    body.fare = Number(body.fare);

    if (new Date(body.departure_datetime) >= new Date(body.arrival_datetime)) {
        showMessage("Arrival must be later than departure.", true);
        return;
    }

    try {
        const data = await api("/schedules", "POST", body);
        showMessage(data.message);
        e.target.reset();
        await loadSchedules();
    } catch(error) { showMessage(error.message, true); }
});

async function initialize() {
    if (!token) return;

    try {
        if (!(await verifyAdmin())) return;
        await Promise.all([loadBuses(), loadRoutes(), loadSchedules()]);
    } catch(error) {
        showMessage(error.message, true);
    }
}

initialize();
</script>
</body>
</html>
