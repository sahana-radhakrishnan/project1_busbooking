
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRANSITIQ | Passenger Login</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f6fb;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:white;width:100%;max-width:440px;padding:32px;border-radius:14px;box-shadow:0 5px 25px #15294b18}
.logo{text-align:center;font-size:27px;font-weight:bold;color:#101d3a;margin-bottom:8px}
.logo span{color:#147d72}
h2{text-align:center;margin:12px 0 25px;color:#142747}
label{font-weight:bold;font-size:13px}
input{width:100%;padding:13px;margin:8px 0 17px;border:1px solid #ccd5e2;border-radius:7px}
button{width:100%;padding:13px;background:#147d72;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
button:hover{background:#0e6259}
button:disabled{opacity:.6;cursor:not-allowed}
a{color:#147d72;text-decoration:none}
a:hover{text-decoration:underline}
.links{text-align:center;line-height:2;margin-top:18px;font-size:14px}
.message{padding:11px;border-radius:7px;margin-top:15px;display:none;font-size:14px;line-height:1.5}
.error{display:block;background:#ffe5e5;color:#a32929}
.success{display:block;background:#dff5e9;color:#12653f}
</style>
</head>
<body>
<div class="card">
    <div class="logo">TRANSIT<span>IQ</span></div>
    <h2>Passenger Login</h2>

    <form id="loginForm">
        <label>Email Address</label>
        <input id="email" type="email" required placeholder="Enter your email">

        <label>Password</label>
        <input id="password" type="password" required placeholder="Enter your password">

        <button type="submit" id="loginButton">Login</button>
    </form>

    <div id="message" class="message"></div>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a><br>
        Don't have an account? <a href="register.html">Register here</a><br>
        <a href="admin-login.html">Admin Login</a>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    message.className = "message";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password})
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login failed.");
        }

        if (!data.token || !data.user) {
            throw new Error("Login response is incomplete. Please try again.");
        }

        if (data.user.role !== "PASSENGER") {
            throw new Error("This is the passenger login. Please use Admin Login.");
        }

        localStorage.setItem("transitiq_token", data.token);
        localStorage.setItem("transitiq_user", JSON.stringify(data.user));

        message.textContent = "Login successful! Opening your dashboard...";
        message.className = "message success";

        window.location.replace("index.html");

    } catch (error) {
        message.textContent = error.message;
        message.className = "message error";
        button.disabled = false;
        button.textContent = "Login";
    }
});
</script>
</body>
</html>
