
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSITIQ | Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101b35, #244b78);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #17365d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        h3 {
            color: #17365d;
            margin: 20px 0 12px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #24558a;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #17365d;
            text-decoration: none;
        }

        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TRANSITIQ</h1>
    <p class="subtitle">Reset your account password</p>

    <h3>1. Request OTP</h3>

    <form id="otpForm">
        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit">Generate OTP</button>
    </form>

    <h3>2. Reset Password</h3>

    <form id="resetForm">
        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            pattern="[0-9]{6}"
            required
        >

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">Reset Password</button>
    </form>

    <p id="message"></p>

    <p class="note">
        For this local project demonstration, the generated OTP
        is printed in the backend server terminal.
    </p>

    <a href="login.html">Back to Login</a>

</div>

<script>
    const message = document.getElementById("message");

    document.getElementById("otpForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();

        try {
            const response = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            message.style.color = response.ok ? "green" : "red";
            message.textContent = data.message || "Request completed.";

        } catch (error) {
            message.style.color = "red";
            message.textContent = "Unable to connect to the server.";
        }
    });

    document.getElementById("resetForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const otp = document.getElementById("otp").value.trim();
        const new_password = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!email) {
            message.style.color = "red";
            message.textContent = "Enter your registered email first.";
            return;
        }

        if (new_password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match.";
            return;
        }

        try {
            const response = await fetch("/api/auth/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    otp,
                    new_password
                })
            });

            const data = await response.json();

            message.style.color = response.ok ? "green" : "red";
            message.textContent = data.message || "Password reset completed.";

            if (response.ok) {
                document.getElementById("resetForm").reset();
            }

        } catch (error) {
            message.style.color = "red";
            message.textContent = "Unable to connect to the server.";
        }
    });
</script>

</body>
</html>
